name: Deploy SymvaCAS Web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'app/src/main/python/**'
      - 'app/src/main/assets/catalog_help*.md'
      - 'app/src/main/java/com/kirinonakar/symvacas/ui/Catalog.kt'
      - 'LICENSE'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: symvacas-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/configure-pages@v6
      - name: Build the static WASM site
        run: python web/build.py --output build/web
      - name: Upload the site with index.html at its root
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web
          include-hidden-files: true
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
